name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # No key here on purpose: the AI code is tested against a mocked API. The live check is below.
      - run: bun run test
      - run: bun run build

  image:
    name: Docker image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: trip-check:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name app -p 3000:3000 trip-check:ci
          for i in $(seq 1 30); do curl -fs http://localhost:3000/ >/dev/null && break; sleep 1; done
          curl -fs http://localhost:3000/ | grep -q "Trip check"
          curl -fs "http://localhost:3000/api/airports?q=new" | grep -q '"JFK"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/chat -H 'content-type: application/json' -d '{}')" = 503
          docker logs app
          docker rm -f app
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  ai-live:
    name: Live AI check (OpenRouter)
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
    steps:
      - name: Skip without a key
        if: env.OPENROUTER_API_KEY == ''
        run: echo "::notice::OPENROUTER_API_KEY secret not set, live AI check skipped."
      - uses: actions/checkout@v4
        if: env.OPENROUTER_API_KEY != ''
      - uses: oven-sh/setup-bun@v2
        if: env.OPENROUTER_API_KEY != ''
        with:
          bun-version: 1.3.11
      - name: Build, start, ask for a message and a chat answer
        if: env.OPENROUTER_API_KEY != ''
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:3000/ >/dev/null && break; sleep 1; done
          bun run smoke:ai http://localhost:3000 || { cat server.log; exit 1; }
